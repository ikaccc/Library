syntax = "proto3";

package library.lending.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option csharp_namespace = "Library.Lending.Contracts.V1";

service BooksService {
  rpc RegisterBook(RegisterBookRequest) returns (Book);
  rpc GetBook(GetBookRequest) returns (Book);
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse);
  rpc UpdateBook(UpdateBookRequest) returns (Book);
  rpc DeleteBook(DeleteBookRequest) returns (google.protobuf.Empty);
}

message Book {
  string id = 1;
  string title = 2;
  string author = 3;
  optional string isbn = 4;
  int32 page_count = 5;
  int32 total_copies = 6;
  int32 available_copies = 7;
  google.protobuf.Timestamp registered_at = 8;
}

message RegisterBookRequest {
  string title = 1;
  string author = 2;
  optional string isbn = 3;
  int32 page_count = 4;
  int32 total_copies = 5;
}

message GetBookRequest {
  string id = 1;
}

message UpdateBookRequest {
  string id = 1;
  string title = 2;
  string author = 3;
  optional string isbn = 4;
  int32 page_count = 5;
  int32 total_copies = 6;
}

message DeleteBookRequest {
  string id = 1;
}

message ListBooksRequest {
  optional string search = 1;
  int32 page = 2; 
  int32 page_size = 3;
}

message ListBooksResponse {
  repeated Book books = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_count = 4;
}
